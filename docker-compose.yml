services:
  postgres:
    image: postgres:16

    container_name: aegis_postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aegis

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7

    container_name: aegis_redis

    ports:
      - "6379:6379"

volumes:
  postgres_data:
